architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/lne_paladins.accesswidener")
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"

    // There is no Forgified Fabric API on the 1.20.1 line: common/ must stay Fabric-API-free.
    // Fabric-API-shaped call sites (datagen especially) live in the fabric/ module instead.

    // LOAD-BEARING, do not add `{ transitive = false }`: nothing in this module uses cloth-config, but
    // its POM pulls the fabric-api BOM onto this module's compile - and therefore Loom remap - classpath.
    // Every ecosystem library below is a Modrinth `-fabric` jar (Modrinth publishes no xplat flavour),
    // and there is ONE shared Loom cache entry per coordinate for `:common` and `:fabric`. Without
    // Fabric API on this remap classpath, Minecraft methods inherited through a Fabric API supertype
    // stay intermediary and `:fabric:runDatagen` dies with
    // `NoSuchMethodError: FabricDataOutput.method_45973` (port notes 11.1 shape A). Same shape as the
    // Bards / Berserker / More RPG Library forks. Fabric API is compile-visible here ONLY - this module
    // is also compiled into the Forge jar, so it must still never call a Fabric API class.
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")

    // Ecosystem libraries: all resolved from the Modrinth maven, `-fabric` flavour (dummy platform).
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}") { transitive = false }
    // More RPG Library: resolves once Fichte's release tier 1 publishes it.
    modImplementation("maven.modrinth:more-rpg-library:${project.more_rpg_library_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:paladins-and-priests:${project.paladins_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:shield-api:${project.shield_api_version}-${platform}") { transitive = false }

    // Loot & Explore is deliberately NOT a compile dependency of any module: it is Fabric-only
    // (no Forge build on any game version) and it implements Fabric API interfaces, so putting it
    // on this Fabric-API-free module's classpath would half-remap it and poison the shared Loom
    // cache. Its one compile-time symbol - the `loot_n_explore:loot.generic` creative-tab key -
    // is named by identifier in `com.lne_paladins.compat.LootNExplore` instead.
}
