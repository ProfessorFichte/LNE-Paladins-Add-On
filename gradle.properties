# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version = 1.2.1.002
maven_group = com.lne_paladins
archives_name = lne_paladins
enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version = 1.20.1
minecraft_compat_version = 1.20.1
yarn_mappings = 1.20.1+build.1

# Dependencies
fabric_loader_version = 0.19.5
# Oldest loader this mod actually runs on. NOT the build version above -
# driving the manifest from that would over-declare the requirement.
fabric_loader_compat_version=0.14.21
# fabric-api is a `fabric/` module dependency ONLY. There is no Forgified Fabric API on this
# line, so `common/` must stay Fabric-API-free.
fabric_api_version = 0.92.12+1.20.1
forge_version = 1.20.1-47.4.22

cloth_config_version=11.1.106
# Modrinth maven coordinates: maven.modrinth:tiny-config:<version>-<platform> (fabric/ + forge/)
tiny_config_version=3.1.0+1.20.1
# Modrinth maven coordinates: maven.modrinth:armor-model-api:<version>-<platform>
armor_model_api_version=1.0.0+1.20.1
# mavenLocal: net.foundation:structure_pool_api-<platform>. Modrinth has 1.2.1+1.20.1 for both
# loaders too; left on mavenLocal here because nothing in this repo compiles against it.
structure_pool_api_version=1.2.1.001+1.20.1
# Modrinth maven coordinates: maven.modrinth:spell-power:<version>-<platform> (fabric/ + forge/)
spell_power_version=1.6.0+1.20.1
# Modrinth maven coordinates: maven.modrinth:spell-engine:<version>-<platform> (fabric/ + forge/)
spell_engine_version=1.10.5+1.20.1

# `common/` resolves these three from mavenLocal as the architectury **xplat** (`-common`) artifact
# instead, and it has to: Modrinth publishes one artifact per loader and no xplat flavour, while a
# Fabric-API-free module that remaps a Fabric *platform* jar half-remaps every Minecraft method
# inherited through a Fabric API supertype - and there is only ONE shared Loom cache entry per
# coordinate, so `:fabric` then reuses the broken copy (port notes 1.1; measured again here as
# `NoSuchMethodError: FabricDataOutput.method_45973` out of Spell Engine's `SpellGenerator`).
# These are the newest local xplat builds of the same release lines. They collapse back into the
# properties above the day those releases publish their own `-common` artifact to mavenLocal.
spell_engine_xplat_version=1.10.5.041+1.20.1
spell_power_xplat_version=1.6.0.005+1.20.1
tiny_config_xplat_version=3.1.0.001
# mavenLocal: net.more_rpg_classes:more_rpg_library-<platform>. This one stays on mavenLocal:
# Fichte's Modrinth project still tops out at the ancient Fabric-only 1.2.22-1.20.1. It becomes
# maven.modrinth:more-rpg-library:2.7.2+1.20.1-<platform> the day Fichte publishes the port.
more_rpg_library_version=2.7.2.006+1.20.1
# mavenLocal: net.rpg_series:paladins-<platform>. NOT on Modrinth for 1.20.1 (the project's newest
# 1.20.1 build is the unrelated 1.4.0 line). .010 is the first build with the Forge registration
# fix, so anything older cannot boot on Forge 47.0-47.3 at all.
paladins_version = 3.1.1.012+1.20.1
# Modrinth maven coordinates: maven.modrinth:runes:<version>-<platform>
runes_version = 1.3.2+1.20.1
# mavenLocal: net.fabric_extras:shield_api-<platform> (no game-version suffix). Modrinth has
# 2.2.0+1.20.1 for both loaders; not switched here, the local artifact is the same 2.2.0 content.
shield_api_version=2.2.0.001

# Optional - Loot & Explore is Fabric-only; there is no Forge build on any game version.
# mavenLocal: com.example:Loot-N-Explore (upstream's maven_group is a template leftover;
# the artifactId is the Gradle project name).
loot_n_explore_version=1.0.22.001+1.20.1

# Fabric only
trinkets_version=3.7.2
cardinal_components_version=5.2.0

# Forge only
curios_version=5.14.1+1.20.1
mixin_extras_version=0.5.5

# Dev runtime only
# Not used in code; Spell Engine requires it at runtime, so it is a dev-runtime pin only.
player_anim_version=1.0.2+1.19.4
# Not used in code; keeps More-RPG-Library's critical_strike attributes resolvable in the log.
# Modrinth maven coordinates: maven.modrinth:critical-strike:<version>-<platform>
critical_strike_version=1.0.4+1.20.1
